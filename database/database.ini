; MariaDB 설정. setup_mariadb.sh가 이 파일을 읽어 서버 설정과 DB/사용자를 적용합니다.
;
;   - [server]의 항목은 그대로 mysqld 옵션으로 들어갑니다. 여기 없는 옵션도 자유롭게 추가할 수 있습니다.
;   - 이 파일에 없는 데이터베이스나 사용자를 삭제하지는 않습니다. (추가/갱신만)
;   - 비밀번호는 이 파일에 쓰지 않습니다. secrets/ 파일이나 환경 변수를 사용하세요.
;
; 적용:  sudo ./setup_mariadb.sh

[server]
; ── 장비마다 다른 값은 여기 없습니다 ──────────────────────────────────
;
; bind_address · port · innodb_buffer_pool_size 는 **그 장비에서 정하는
; 값**이라 이 파일에 두지 않습니다. 이 파일은 커밋되기 때문입니다 — 여기서
; 고치면 다음 git pull 과 부딪히고, 커밋해 버리면 한 장비의 결정이 다른
; 단지로 딸려 갑니다. (다른 넷도 같은 이유로 settings.ini 를 씁니다 —
; docs/guide/contracts.md '설정 규약')
;
;   구축 마법사의 DB 단계 폼  →  database/settings.ini  (커밋하지 않습니다)
;   항목의 뜻과 기본값        →  database/settings-schema.json
;
; 폼을 쓰지 않는다면 그 파일을 손으로 적어도 됩니다. 아무 데도 적지 않으면
; 기본값(127.0.0.1 · 3306 · 256M)을 씁니다.
;
; 아래는 어느 장비에서나 같은 값들입니다.

character_set_server = utf8mb4
collation_server = utf8mb4_unicode_ci

max_connections = 151
max_allowed_packet = 64M

; InnoDB — buffer pool 크기는 장비마다 다르므로 위의 폼이 받습니다.
innodb_log_file_size = 64M
innodb_flush_log_at_trx_commit = 1
innodb_file_per_table = 1

; 느린 쿼리 로그
slow_query_log = 1
slow_query_log_file = /var/log/mysql/slow.log
long_query_time = 2

log_error = /var/log/mysql/error.log
expire_logs_days = 10

[security]
; 익명 사용자 제거
remove_anonymous_users = true
; 기본 생성되는 test 데이터베이스 제거
remove_test_database = true
; 원격지에서의 root 로그인 차단 (localhost만 허용)
disallow_remote_root = true

; --- 데이터베이스 ---
; [database:이름] 형식. charset/collation은 생략하면 [server] 값을 씁니다.
;
; 스키마 SQL은 각 서비스 디렉토리가 소유합니다. schema_dir 안의 *.sql 을 이름순으로 실행하므로
; 확장할 때는 그 디렉토리에 002-xxx.sql 을 추가하고 다시 적용하면 됩니다.
; 모든 파일은 여러 번 실행해도 안전하게 작성해야 합니다. (CREATE TABLE IF NOT EXISTS 등)
;
; DB 이름에는 하이픈을 쓸 수 없어 서비스 ws-bridge 의 스키마는 ws_bridge 입니다.

[database:manager]
schema_dir = ../services/manager/schema

; 서비스를 붙일 때는 여기에 [database:이름] 절과 schema_dir 을 추가한다
; (docs/guide/rollout.md 의 '손으로 고쳐야 하는 자리' ①). schema_dir 이 없어도
; setup_mariadb.sh 는 멈추지 않지만, 적어 두면 쓰지 않는 빈 데이터베이스가 만들어진다.


; --- 사용자 ---
; [user:이름] 형식.
;
;   host          접속 허용 호스트. **쉼표로 여럿 적을 수 있습니다** —
;                 MariaDB 는 user@host 가 키라 자리마다 계정이 따로 있어야
;                 합니다 (localhost, 127.0.0.1, 10.10.0.%)
;   databases     권한을 줄 DB 목록 (쉼표 구분, * 는 전체)
;   privileges    ALL 또는 SELECT,INSERT,UPDATE,DELETE 처럼 나열
;   password_env  비밀번호를 담은 환경 변수 이름
;   password_file 비밀번호가 든 파일 경로
;
; 둘 다 없으면 secrets/<사용자>.pw 에 새로 만들어 저장합니다. (권한 600)

; manager 스키마를 다루는 계정.
;
; manager 는 DB 와 같은 장비에서 돌므로 접속을 이 장비로 한정한다 (localhost 는 소켓,
; 127.0.0.1 은 TCP). 다른 장비에서 DB 에 붙어야 하면 host 에 그 대역을 덧붙인다 —
; MariaDB 는 user@host 가 키라 자리마다 계정이 따로 만들어진다.
;
; ⚠️ 이미 다른 host 로 계정을 만들어 둔 장비에서는 이 값을 바꾸는 것만으로 좁혀지지
;    않는다. setup_mariadb.sh 는 추가·갱신만 하고 지우지 않으므로 옛 계정이
;    그대로 남는다.
;
;      sudo mariadb -e "SELECT user, host FROM mysql.user WHERE user = 'webservices';"
;      sudo mariadb -e "DROP USER 'webservices'@'10.10.0.%';"
;
; 비밀번호는 secrets/webservices.pw 에 있습니다.
[user:webservices]
host = localhost, 127.0.0.1
databases = manager
privileges = ALL
